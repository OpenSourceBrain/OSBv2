name: Docker Image Build NetPyNE-UI

on:
  push:
    branches: [ master, dev*, feature/docker*, feature/repo*, jupyterhub-update ]
  pull_request:
    branches: [ master, dev*, feature/docker*, feature/repo*, jupyterhub-update ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Clone Netpyne UI dependencies
      run: |
        mkdir -p applications/netpyne/dependencies
        export URL=$(grep "url:" applications/netpyne/deploy/values.yaml | awk '{print $3}')
        export BRANCH_TAG=$(grep "branch_tag:" applications/netpyne/deploy/values.yaml | awk '{print $2}')
        echo "Using branch: $BRANCH_TAG on $URL"
        git clone --branch $BRANCH_TAG $URL applications/netpyne/dependencies/NetPyNE-UI
        ls -alt applications/netpyne/dependencies/NetPyNE-UI

    - name: Build the Docker image
      run: |
        cd applications/netpyne
        docker build -t mynpui -f Dockerfile --no-cache .
        
    - name: Info on Docker image sizes
      run: |
        docker images

    - name: Run the Docker container and list python installs
      run: |
        cd applications/netpyne
        ./pip_info.sh
