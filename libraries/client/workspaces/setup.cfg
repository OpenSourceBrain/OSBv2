[metadata]
name = workspaces-cli
version = 0.9.0
description = OSB Workspaces manager API
author = Open Source Brain authors
author_email = info@opensourcebrain.org
url = https://opensourcebrain.org
keywords = OSB Workspaces manager API
license = UNLICENSED
long_description = file: README.md
long_description_content_type = text/markdown

[options]
python_requires = >=3.6
install_requires =
    urllib3 >= 1.25.3
    python-dateutil
packages = find:
include_package_data = True

[options.packages.find]
exclude =
    test
    tests

[flake8]
max-line-length=99
