{{- /* run.sh for notebook runs (POST /workspace/{id}/run), from deploy/resources/run-notebooks/. Mounted into
the run's pod, whatever image it runs in (service/workflow.py). */}}
kind: ConfigMap
apiVersion: v1
metadata:
  name: workspaces-run-notebooks
  labels:
    app: workspaces
{{ include "deploy_utils.labels" $ | indent 4 }}
data:
  run.sh: {{ required "deploy/resources/run-notebooks/run.sh is missing" (.Files.Get "resources/workspaces/run-notebooks/run.sh") | quote }}
