{{- /* The script notebook runs (POST /workspace/{id}/run) use, deploy/resources/run-notebooks/run.sh. Not
built into an image: the run's pod mounts it, in whichever image the request names (service/workflow.py). */}}
kind: ConfigMap
apiVersion: v1
metadata:
  name: workspaces-run-notebooks
  labels:
    app: workspaces
{{ include "deploy_utils.labels" $ | indent 4 }}
data:
  run.sh: {{ required "deploy/resources/run-notebooks/run.sh is missing" (.Files.Get "resources/workspaces/run-notebooks/run.sh") | quote }}
