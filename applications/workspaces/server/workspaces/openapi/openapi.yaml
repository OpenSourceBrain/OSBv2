openapi: 3.0.0
info:
    title: OSB Workspaces manager API
    version: 0.2.0
    description: Opensource Brain Platform - Reference Workspaces manager API
    license:
        name: UNLICENSED
servers:
    -
        url: /api
        description: SwaggerHub API Auto Mocking
paths:
    /live:
        get:
            tags:
                - k8s
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                type: string
                    description: Healthy
                '500':
                    description: Application is not healthy
            operationId: live
            summary: Test if application is healthy
            x-openapi-router-controller: workspaces.controllers.k8s_controller
    /ready:
        get:
            tags:
                - k8s
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                type: string
                    description: Ready
                '500':
                    description: Application is not ready yet
            operationId: ready
            summary: Test if application is ready to take requests
            x-openapi-router-controller: workspaces.controllers.k8s_controller
    /workspace:
        get:
            tags:
                - rest
            parameters:
                -
                    name: page
                    description: The page number for starting to collect the result set.
                    schema:
                        default: 1
                        type: integer
                    in: query
                    required: false
                -
                    name: per_page
                    description: The number of items to return.
                    schema:
                        default: 20
                        type: integer
                    in: query
                    required: false
                -
                    examples:
                        'Search by name, id and tag':
                            value: 'name__like=Work%+id__=1+tags[tag]=Tag'
                    name: q
                    description: >-
                        The search string for filtering of the items to return. Multiple criteria are
                        seperated by '+' (and operator is applied). Format [field/relation[field]][comparator
                        = , __not= , __like= ][value]
                    schema:
                        type: string
                        example: 'name__like=Work%+id__=1+tags[tag]=Tag'
                    in: query
                    required: false
                -
                    name: tags
                    description: The tags to filter with Multiple parameters are concatenated with + (OR operator)
                    schema:
                        nullable: true
                        type: string
                        example: tag1+tag2
                    in: query
                    required: false
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    pagination:
                                        $ref: '#/components/schemas/Pagination'
                                    workspaces:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/Workspace'
                    description: Return all available workspaces
            security:
                - {}
                -
                    bearerAuth: []
            summary: Used to list all available workspaces.
        post:
            requestBody:
                description: The Workspace to save.
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Workspace'
                required: true
            tags:
                - rest
            responses:
                '201':
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Workspace'
                    description: Save successful.
                '400':
                    description: The Workspace already exists.
                '405':
                    description: Not allowed to create a new workspace
            security:
                -
                    bearerAuth: []
            summary: >-
                Used to save a Workspace to the repository. The user_id (keycloak user id) will be
                automatically filled with the current user
    '/workspace/{id}':
        get:
            tags:
                - rest
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Workspace'
                    description: The workspace.
                '404':
                    description: The workspace was not found.
            security:
                - {}
                -
                    bearerAuth: []
            summary: Used to retrieve a workspace from the repository.
        put:
            requestBody:
                description: The workspace to save.
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Workspace'
                required: true
            tags:
                - rest
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Workspace'
                    description: The workspace was updated.
                '404':
                    description: The workspace was not found.
            security:
                -
                    bearerAuth: []
            summary: Update a workspace in the repository.
        delete:
            tags:
                - rest
            responses:
                '200':
                    description: The workspace was deleted.
                '404':
                    description: The workspace was not found.
            security:
                -
                    bearerAuth: []
            summary: Delete a workspace from the repository.
        parameters:
            -
                name: id
                schema:
                    type: integer
                in: path
                required: true
    '/workspace/{id}/import':
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                resourceorigins:
                                    type: array
                                    items:
                                        $ref: '#/components/schemas/ResourceOrigin'
            tags:
                - rest
            responses:
                '200':
                    description: The workspace was updated with the thumbnail.
                '404':
                    description: The workspace was not found or the thumbnail was not specified
            security:
                -
                    bearerAuth: []
            operationId: workspaces.controllers.workspace_controller.import_resources
            summary: Imports the ResourceOrigins into the Workspace and creates/updates the workspace resources
        parameters:
            -
                name: id
                description: Workspace ID of the workspace
                schema:
                    type: integer
                in: path
                required: true
    '/workspace/{id}/run':
        post:
            requestBody:
                description: The notebooks to run, and the data to run them on.
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/WorkspaceRunRequest'
                required: true
            tags:
                - run
            responses:
                '202':
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WorkspaceRunResponse'
                    description: Run submitted. While it runs, GET /workspace/{id} lists the "Refreshing resources" placeholder, as for an import.
                '400':
                    description: A path is not inside the workspace, or the request is incomplete.
                '401':
                    description: Missing or invalid token.
                '403':
                    description: Only the workspace's owner may run in it.
                '404':
                    description: The workspace was not found.
                '409':
                    description: >-
                        A run is already in progress in this workspace, or its owner has as many runs in
                        progress as their quota allows (quota-ws-open).
            security:
                -
                    bearerAuth: []
            operationId: run_notebooks
            summary: >-
                Run notebooks of a repository on the workspace's volume (papermill in an Argo
                task), in the order given, after setting up what the request names (requirements,
                PYTHONPATH, installs). Returns at once.
            x-openapi-router-controller: workspaces.controllers.workspace_run_controller
        parameters:
            -
                name: id
                description: Workspace ID of the workspace
                schema:
                    type: integer
                in: path
                required: true
    '/workspace/{id}/clone':
        put:
            tags:
                - rest
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Workspace'
                    description: The workspace was cloned.
                '404':
                    description: The workspace was not found
            security:
                -
                    bearerAuth: []
            operationId: workspaces.controllers.workspace_controller.workspace_clone
            summary: Clones a workspace
        parameters:
            -
                name: id
                description: Workspace ID of the workspace
                schema:
                    type: integer
                in: path
                required: true
    '/workspace/{id}/open':
        get:
            tags:
                - rest
            responses:
                '200':
                    description: The workspace volume is ready to be mounted.
                '404':
                    description: The workspace was not found.
                '503':
                    description: The workspace volume is not ready yet. Temporary error, the client should retry.
            security:
                - {}
                -
                    bearerAuth: []
            operationId: workspaces.controllers.workspace_controller.open
            summary: Ensure the workspace volume exists and is ready before opening the workspace.
        parameters:
            -
                name: id
                description: Workspace ID of the workspace
                schema:
                    type: integer
                in: path
                required: true
    '/workspace/{id}/thumbnail':
        post:
            requestBody:
                content:
                    multipart/form-data:
                        schema:
                            type: object
                            properties:
                                thumbNail:
                                    format: binary
                                    type: string
            tags:
                - rest
            responses:
                '200':
                    description: The workspace was updated with the thumbnail.
                '404':
                    description: The workspace was not found or the thumbnail was not specified
            security:
                -
                    bearerAuth: []
            operationId: workspaces.controllers.workspace_controller.setthumbnail
            summary: Sets the thumbnail of the workspace.
        parameters:
            -
                name: id
                description: Workspace ID of the workspace
                schema:
                    type: integer
                in: path
                required: true
    '/workspace/{id}/gallery':
        post:
            requestBody:
                content:
                    multipart/form-data:
                        schema:
                            type: object
                            properties:
                                image:
                                    format: binary
                                    type: string
            tags:
                - rest
            responses:
                '200':
                    description: The image was added to the workspace.
                '404':
                    description: The workspace was not found or the image was not specified
            security:
                -
                    bearerAuth: []
            operationId: workspaces.controllers.workspace_controller.addimage
            summary: Adds and image to the workspace.
        parameters:
            -
                name: id
                description: Workspace ID of the workspace
                schema:
                    type: integer
                in: path
                required: true
    '/workspace/{id}/gallery/{image_id}':
        delete:
            tags:
                - rest
            responses:
                '200':
                    description: The Workspace Image is successfully deleted from the workspace.
                '404':
                    description: The workspace was not found.
            security:
                -
                    bearerAuth: []
            operationId: delimage
            summary: Delete a Workspace Image from the workspace.
            x-openapi-router-controller: workspaces.controllers.workspace_controller
        parameters:
            -
                name: id
                description: Workspace ID of the workspace
                schema:
                    type: integer
                in: path
                required: true
            -
                name: image_id
                description: Workspace Image Id to be deleted from the workspace
                schema:
                    type: integer
                in: path
                required: true
    /workspaceresource:
        post:
            requestBody:
                description: The WorkspaceResource to save.
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/WorkspaceResource'
                required: true
            tags:
                - rest
            responses:
                '201':
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WorkspaceResource'
                    description: Save successful.
                '400':
                    description: The WorkspaceResource already exists.
            security:
                -
                    bearerAuth: []
            summary: Used to save a WorkspaceResource to the repository.
    '/workspaceresource/{id}':
        get:
            tags:
                - rest
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WorkspaceResource'
                    description: The WorkspaceResource.
                '404':
                    description: The WorkspaceResource was not found.
            security:
                -
                    bearerAuth: []
            summary: Used to retrieve a WorkspaceResource.
        put:
            requestBody:
                description: The WorkspaceResource to save.
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/WorkspaceResource'
                required: true
            tags:
                - rest
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WorkspaceResource'
                    description: The WorkspaceResource was updated.
                '404':
                    description: The WorkspaceResource was not found.
            security:
                -
                    bearerAuth: []
            summary: Update the WorkspaceResource.
        delete:
            tags:
                - rest
            responses:
                '200':
                    description: The WorkspaceResource was deleted.
                '404':
                    description: The WorkspaceResource was not found.
            security:
                -
                    bearerAuth: []
            summary: Delete a WorkspaceResource.
        parameters:
            -
                name: id
                schema:
                    type: integer
                in: path
                required: true
    '/workspaceresource/{id}/open':
        get:
            tags:
                - rest
            responses:
                '200':
                    description: The WorkspaceResource was updated.
                '404':
                    description: The WorkspaceResource was not found.
            security:
                -
                    bearerAuth: []
            operationId: workspaces.controllers.workspace_resource_controller.open
            summary: >-
                Used to register a WorkspaceResource open action. The WorkspaceResource timestamp last open
                will be updated
        parameters:
            -
                name: id
                description: WorkspaceResource ID of the WorkspaceResource
                schema:
                    type: integer
                in: path
                required: true
    /osbrepository:
        get:
            tags:
                - rest
            parameters:
                -
                    name: page
                    description: The page number for starting to collect the result set.
                    schema:
                        default: 1
                        type: integer
                    in: query
                    required: false
                -
                    name: per_page
                    description: The number of items to return.
                    schema:
                        default: 20
                        type: integer
                    in: query
                    required: false
                -
                    name: q
                    description: >-
                        The search string for filtering of the items to return. Format
                        [field/relation[field]][comparator = , __not= , __like= ][value]. Multiple parameters
                        are concatenated with + (OR operator)
                    schema:
                        nullable: true
                        type: string
                        example: name=myrepo+summary__like=%reposi%
                    in: query
                    required: false
                -
                    name: tags
                    description: The tags to filter with Multiple parameters are concatenated with + (OR operator)
                    schema:
                        nullable: true
                        type: string
                        example: tag1+tag2
                    in: query
                    required: false
                -
                    name: types
                    description: The tags to filter with Multiple parameters are concatenated with + (OR operator)
                    schema:
                        nullable: true
                        type: string
                        example: experimental+modeling
                    in: query
                    required: false
                -
                    name: user_id
                    description: The id of the owner user to filter with
                    schema:
                        nullable: true
                        type: string
                        example: ccfbe969-f7e2-4191-80c4-821dc5a97a28
                    in: query
                    required: false
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    pagination:
                                        $ref: '#/components/schemas/Pagination'
                                    osbrepositories:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/OSBRepository'
                    description: Return all available repositories
            summary: Used to list all available repositories.
        post:
            requestBody:
                description: The OSB repository to save.
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/OSBRepository'
                required: true
            tags:
                - rest
            responses:
                '201':
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OSBRepository'
                    description: Save successful.
                '400':
                    description: The OSB repository already exists.
            security:
                -
                    bearerAuth: []
            summary: >-
                Used to save a OSB Repository. The user_id (keycloak user id) will be automatically filled
                with the current user
    /osbrepository/description:
        get:
            tags:
                - rest
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                type: string
                    description: The description for repository.
                '404':
                    description: The repository was not found.
            operationId: get_description
            summary: Used to retrieve description for a repository.
            x-openapi-router-controller: workspaces.controllers.osbrepository_controller
        parameters:
            -
                name: uri
                schema:
                    type: string
                in: query
                required: true
            -
                name: repository_type
                schema:
                    $ref: '#/components/schemas/RepositoryType'
                in: query
                required: true
            -
                name: context
                schema:
                    type: string
                in: query
                required: true
    '/osbrepository/{id}':
        get:
            tags:
                - rest
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OSBRepository'
                    description: The repository.
                '404':
                    description: The repository was not found.
            summary: Used to retrieve a repository.
        put:
            requestBody:
                description: The repository to save.
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/OSBRepository'
                required: true
            tags:
                - rest
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OSBRepository'
                    description: The workspace was updated.
                '404':
                    description: The workspace was not found.
            security:
                -
                    bearerAuth: []
            summary: Update a OSB repository.
        delete:
            tags:
                - rest
            responses:
                '200':
                    description: The OSBRepository was deleted.
                '404':
                    description: The OSBRepository was not found.
            security:
                -
                    bearerAuth: []
            summary: Delete a OSBRepository.
        parameters:
            -
                name: id
                schema:
                    type: integer
                in: path
                required: true
            -
                name: context
                description: 'the context for getting the resources, optional'
                schema:
                    type: string
                in: query
    /volumestorage:
        get:
            tags:
                - rest
            parameters:
                -
                    name: page
                    description: The page number for starting to collect the result set.
                    schema:
                        default: 1
                        type: integer
                    in: query
                    required: false
                -
                    name: per_page
                    description: The number of items to return.
                    schema:
                        default: 20
                        type: integer
                    in: query
                    required: false
                -
                    name: q
                    description: >-
                        The search string for filtering of the items to return. Format
                        [field/relation[field]][comparator = , __not= , __like= ][value]
                    schema:
                        type: string
                        example: name__like=%storage%
                    in: query
                    required: false
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    pagination:
                                        $ref: '#/components/schemas/Pagination'
                                    volumestorages:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/VolumeStorage'
                    description: Return all available volumestorages
            security:
                -
                    bearerAuth: []
            summary: Used to list all available volumestorages.
        post:
            requestBody:
                description: The VolumeStorage to save.
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/VolumeStorage'
                required: true
            tags:
                - rest
            responses:
                '201':
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/VolumeStorage'
                    description: Save successful.
                '400':
                    description: The VolumeStorage already exists.
            security:
                -
                    bearerAuth: []
            summary: >-
                Used to save a VolumeStorage to the repository. The user_id (keycloak user id) will be
                automatically filled with the current user
    '/volumestorage/{id}':
        get:
            tags:
                - rest
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/VolumeStorage'
                    description: The volumestorage.
                '404':
                    description: The volumestorage was not found.
            summary: Used to retrieve an volumestorage from the repository.
        put:
            requestBody:
                description: The volumestorage to save.
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/VolumeStorage'
                required: true
            tags:
                - rest
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/VolumeStorage'
                    description: The volumestorage was updated.
                '404':
                    description: The volumestorage was not found.
            security:
                -
                    bearerAuth: []
            summary: Update an volumestorage in the repository.
        delete:
            tags:
                - rest
            responses:
                '200':
                    description: The volumestorage was deleted.
                '404':
                    description: The volumestorage was not found.
            security:
                -
                    bearerAuth: []
            summary: Delete an volumestorage from the repository.
        parameters:
            -
                name: id
                schema:
                    type: integer
                in: path
                required: true
    /tag:
        get:
            tags:
                - rest
            parameters:
                -
                    name: page
                    description: The page number for starting to collect the result set.
                    schema:
                        default: 1
                        type: integer
                    in: query
                    required: false
                -
                    name: per_page
                    description: The number of items to return.
                    schema:
                        default: 20
                        type: integer
                    in: query
                    required: false
                -
                    name: q
                    description: >-
                        The search string for filtering of the items to return. Format
                        [field/relation[field]][comparator = , __not= , __like= ][value]
                    schema:
                        type: string
                        example: name__like=%Tag 1%
                    in: query
                    required: false
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    pagination:
                                        $ref: '#/components/schemas/Pagination'
                                    tags:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/Tag'
                    description: Return all available tags
            summary: Used to list all available tags.
        post:
            requestBody:
                description: The Tag to save.
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Tag'
                required: true
            tags:
                - rest
            responses:
                '201':
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Tag'
                    description: Save successful.
                '400':
                    description: The Tag already exists.
            security:
                -
                    bearerAuth: []
            summary: >-
                Used to save a Tag to the repository. The user_id (keycloak user id) will be automatically
                filled with the current user
    '/tag/{id}':
        get:
            tags:
                - rest
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Tag'
                    description: The tag.
                '404':
                    description: The tag was not found.
            summary: Used to retrieve an tag from the repository.
        put:
            requestBody:
                description: The tag to save.
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Tag'
                required: true
            tags:
                - rest
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Tag'
                    description: The tag was updated.
                '404':
                    description: The tag was not found.
            security:
                -
                    bearerAuth: []
            summary: Update an tag in the repository.
        delete:
            tags:
                - rest
            responses:
                '200':
                    description: The tag was deleted.
                '404':
                    description: The tag was not found.
            security:
                -
                    bearerAuth: []
            summary: Delete an tag from the repository.
        parameters:
            -
                name: id
                schema:
                    type: integer
                in: path
                required: true
    /osbrepository/info:
        get:
            tags:
                - rest
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RepositoryInfo'
                    description: The list of repository contexts.
                '404':
                    description: The repository was not found.
            operationId: get_info
            summary: Used to retrieve a list of contexts of a repository.
            x-openapi-router-controller: workspaces.controllers.osbrepository_controller
        parameters:
            -
                name: uri
                schema:
                    type: string
                in: query
                required: true
            -
                name: repository_type
                schema:
                    $ref: '#/components/schemas/RepositoryType'
                in: query
                required: true
    '/osbrepository/{id}/thumbnail/':
        post:
            requestBody:
                content:
                    multipart/form-data:
                        schema:
                            type: object
                            properties:
                                thumbNail:
                                    format: binary
                                    type: string
            tags:
                - rest
            responses:
                '200':
                    description: The repository was updated with the thumbnail.
                '404':
                    description: The repository was not found or the thumbnail was not specified
            security:
                -
                    bearerAuth: []
            operationId: workspaces.controllers.osbrepository_controller.setthumbnail
            summary: Sets the thumbnail of the workspace.
        parameters:
            -
                name: id
                description: 'Repository ID '
                schema:
                    type: integer
                in: path
                required: true
    /user-resource-counts:
        get:
            tags:
                - rest
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                description: 'Per-user resource counts, keyed by keycloak user id'
                                type: object
                                additionalProperties:
                                    type: object
                                    properties:
                                        workspaces:
                                            type: integer
                                        repositories:
                                            type: integer
                    description: Per-user workspace and repository counts.
                '401':
                    description: The user is not authorized.
            security:
                -
                    bearerAuth: []
            operationId: user_resource_counts
            summary: Per-user workspace and repository counts (admin only).
            x-openapi-router-controller: workspaces.controllers.admin_controller
    /ember/get_upload_urls:
        post:
            requestBody:
                description: The file to upload and the EMBER-DANDI dandiset to upload it into.
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/EmberUploadUrlsRequest'
                required: true
            tags:
                - ember
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/EmberUploadUrlsResponse'
                    description: >-
                        Upload reserved. Presigned S3 part URLs the browser PUTs to directly, or
                        (when EMBER-DANDI already holds this content) an empty parts list and the
                        existing blob_id.
                '400':
                    description: Missing or inconsistent fields.
                '401':
                    description: Missing or invalid OSB token.
                '403':
                    description: The upload is not allowed; the message names the failed condition.
                '502':
                    description: EMBER-DANDI refused or failed the call.
            security:
                -
                    bearerAuth: []
            operationId: get_upload_urls
            summary: >-
                Reserve an upload into an EMBER-DANDI dandiset with OSB's EMBER-DANDI key (never
                returned) and return presigned part URLs. The asset path is derived server-side
                from the caller's identity.
            x-openapi-router-controller: workspaces.controllers.ember_controller
    /ember/validate_upload:
        post:
            requestBody:
                description: The parts the browser uploaded, to complete, validate and register as an asset.
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/EmberValidateUploadRequest'
                required: true
            tags:
                - ember
            responses:
                '201':
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/EmberValidateUploadResponse'
                    description: Upload completed, validated and registered in the dandiset's draft version.
                '400':
                    description: Missing or inconsistent fields.
                '401':
                    description: Missing or invalid OSB token.
                '403':
                    description: The upload is not allowed; the message names the failed condition.
                '502':
                    description: EMBER-DANDI refused or failed the call.
            security:
                -
                    bearerAuth: []
            operationId: validate_upload
            summary: >-
                Complete the multipart upload, validate the blob and register the asset in the
                dandiset's draft version, with OSB's EMBER-DANDI key.
            x-openapi-router-controller: workspaces.controllers.ember_controller
components:
    schemas:
        EmberUploadPart:
            type: object
            properties:
                part_number:
                    type: integer
                url:
                    type: string
                    description: Presigned S3 URL the browser PUTs this part's bytes to directly.
        EmberUploadedPart:
            type: object
            properties:
                part_number:
                    type: integer
                size:
                    type: integer
                etag:
                    type: string
                    description: The ETag S3 returned for this part's PUT.
        EmberUploadUrlsRequest:
            type: object
            required:
                - username
                - dandiset_id
                - filename
                - size
                - dandi_etag
            properties:
                username:
                    type: string
                    description: >-
                        Keycloak username whose EMBER-DANDI key (user attribute EMBER_API_KEY)
                        signs the upload.
                dandiset_id:
                    type: string
                    description: The EMBER-DANDI dandiset to upload into, chosen by the client.
                filename:
                    type: string
                size:
                    type: integer
                dandi_etag:
                    type: string
                    description: >-
                        S3-multipart digest in DANDI's format (32 hex chars, a dash, the part
                        count), computed in the browser since the bytes never reach this server.
        EmberUploadUrlsResponse:
            type: object
            required:
                - dandiset_id
                - path
                - parts
            properties:
                dandiset_id:
                    type: string
                upload_id:
                    type: string
                    description: Absent when the content was already in EMBER-DANDI.
                path:
                    type: string
                    description: Asset path, derived server-side from the caller's identity.
                parts:
                    type: array
                    items:
                        $ref: '#/components/schemas/EmberUploadPart'
                blob_id:
                    type: string
                    description: Set only when the content was already in EMBER-DANDI (parts is then empty).
        EmberValidateUploadRequest:
            type: object
            required:
                - username
                - dandiset_id
                - path
            properties:
                username:
                    type: string
                    description: >-
                        Keycloak username whose EMBER-DANDI key (user attribute EMBER_API_KEY)
                        signs the upload.
                dandiset_id:
                    type: string
                upload_id:
                    type: string
                    description: Omitted when get_upload_urls returned a blob_id (nothing was uploaded).
                path:
                    type: string
                    description: The path get_upload_urls returned.
                parts:
                    type: array
                    description: Omitted when get_upload_urls returned a blob_id.
                    items:
                        $ref: '#/components/schemas/EmberUploadedPart'
                blob_id:
                    type: string
                    description: Echoed from get_upload_urls; when present, complete/validate are skipped.
        EmberValidateUploadResponse:
            type: object
            required:
                - asset_id
                - asset_path
                - download_url
            properties:
                asset_id:
                    type: string
                asset_path:
                    type: string
                dandiset_id:
                    type: string
                dandiset_url:
                    type: string
                download_url:
                    type: string
                    description: Where the asset's bytes can be fetched from, e.g. by OSB's workspace import.
        WorkspaceRunRequest:
            description: What to run, how to set it up, and where its files go. All paths are relative.
            type: object
            required:
                - repo
                - notebooks
                - output_dir
                - results
            properties:
                repo:
                    $ref: '#/components/schemas/WorkspaceRunRepo'
                setup:
                    $ref: '#/components/schemas/WorkspaceRunSetup'
                notebooks:
                    type: array
                    minItems: 1
                    items:
                        type: string
                    description: >-
                        The notebooks to run, relative to repo.dir, in this order. Each runs in its own
                        folder in the project (see repo.dir); the run stops at the first that fails.
                input_dir:
                    type: string
                    description: >-
                        The run's input on the volume, passed to the notebooks as their INPUT_DIR
                        parameter, relative to the notebook's folder. Without it they use their own
                        default (e.g. example data).
                output_dir:
                    type: string
                    description: >-
                        Where the notebooks write their results on the volume, passed to them as their
                        OUTPUT_DIR parameter, relative to the notebook's folder.
                results:
                    $ref: '#/components/schemas/WorkspaceRunResults'
                image:
                    type: string
                    description: >-
                        The image to run the notebooks in: an OSB workspace application (e.g. netpyne)
                        or an image from a trusted registry. Defaults to OSB's JupyterLab.
        WorkspaceRunRepo:
            description: The repository the notebooks are in.
            type: object
            required:
                - dir
            properties:
                dir:
                    type: string
                    description: >-
                        The repository on the volume, as imported, inside the run's folder (e.g. the zip's
                        <repo>-<ref>/). That folder is the notebooks' project: the run copies the
                        repository's files there, except names it already has (e.g. the input and output
                        folders), and runs the notebooks from there as they would from the repository, so
                        their executed copies can be run again in JupyterLab. The repository is left as it is.
        WorkspaceRunSetup:
            description: How to set up the repository before the notebooks run; paths it doesn't have are skipped.
            type: object
            properties:
                requirements:
                    type: string
                    description: A requirements file in the repository, installed with pip first.
                python_path:
                    type: array
                    items:
                        type: string
                    description: Folders in the repository to put on PYTHONPATH.
                install:
                    type: array
                    items:
                        type: string
                    description: >-
                        Candidates for installing the repository's own code; the first it has is used.
                        A setup.py or pyproject.toml has its folder pip-installed; any other .py is run.
                        A failure is logged and the run goes on.
        WorkspaceRunResults:
            description: Where the run task's own products go on the volume.
            type: object
            required:
                - notebooks
                - log
            properties:
                notebooks:
                    type: string
                    description: >-
                        Folder for the executed notebooks, created only if every notebook passes; if one
                        fails, they are in <folder>.failed instead. To run them again in JupyterLab, it is
                        their own folder in the project (e.g. <run folder>/notebooks): they replace the
                        originals there.
                log:
                    type: string
                    description: The run's log file. The run is refused if it already exists.
        WorkspaceRunResponse:
            type: object
            required:
                - workflow
            properties:
                workflow:
                    type: string
                    description: The run's Argo workflow name.
        Valid:
            type: object
            properties:
                response:
                    type: string
        Pagination:
            type: object
            properties:
                current_page:
                    type: integer
                number_of_pages:
                    type: integer
                total:
                    type: integer
        PrimaryKey:
            type: integer
            x-primary-key: true
            x-autoincrement: true
        RepositoryType:
            description: |
                Repository type:
                  * dandi - DANDI repository
                  * figshare - FigShare repository
                  * github - Github repository
            enum:
                - dandi
                - figshare
                - github
                - biomodels
            type: string
        RepositoryContentType:
            description: |
                Repository Content type:
                  * experimental - Experimental data
                  * modeling - Modeling
            enum:
                - experimental
                - modeling
            type: string
        ResourceType:
            description: |
                Resource type:
                 * e - Experimental
                 * m - Model
                 * g - Generic
                 * u - Unknown (to be defined)
            default: g
            enum:
                - e
                - m
                - g
                - u
            type: string
            example: g
        ResourceStatus:
            description: |
                Resource status:
                 * a - Available
                 * e - Error, not available
                 * p - Pending
            default: p
            enum:
                - a
                - e
                - p
            type: string
            example: p
        ImageType:
            type: string
        User:
            description: Keycloak User
            type: object
            properties:
                id:
                    description: Keycloak user id
                    type: string
                first_name:
                    description: First Name of the keycloak user
                    type: string
                last_name:
                    description: Last Name of the keycloak user
                    type: string
                username:
                    description: Username of the keycloak user
                    type: string
                email:
                    description: Email address of the keycloak user
                    type: string
        WorkspaceBase:
            description: Workspace item
            required:
                - name
                - description
            type: object
            properties:
                id:
                    $ref: '#/components/schemas/PrimaryKey'
                    description: Unique identifier of the Workspace
                name:
                    description: Workspace name.
                    type: string
                    example: Workspace One
                description:
                    description: Workspace description.
                    type: string
                    example: Workspace One description
                timestamp_created:
                    format: date-time
                    description: Date/time the Workspace is created
                    type: string
                    example: '2019-11-23T01:23:45.000Z'
                timestamp_updated:
                    format: date-time
                    description: Date/time the Workspace is last updated
                    type: string
                    example: '2019-11-23T01:23:45.000Z'
                last_opened_resource_id:
                    description: The workspace resource id the workspace is opened last with
                    type: integer
                thumbnail:
                    $ref: '#/components/schemas/ImageType'
                    description: Workspace type icon.
                gallery:
                    description: Gallery with images of the workspace
                    type: array
                    items:
                        allOf:
                            -
                                $ref: '#/components/schemas/WorkspaceImage'
                user_id:
                    description: 'Workspace keycloak user id, will be automatically be set to the logged in user'
                    type: string
                publicable:
                    description: Is this a public workspace? Default false
                    default: false
                    type: boolean
                    example: false
                featured:
                    description: Is this a featured workspace? Default false
                    default: false
                    type: boolean
                    example: false
                license:
                    description: Workspace license
                    type: string
                    example: license
                collaborators:
                    description: Collaborators who work on the workspace
                    type: array
                    items:
                        $ref: '#/components/schemas/WorkspaceCollaborator'
                storage:
                    $ref: '#/components/schemas/VolumeStorage'
                    description: Storage of the workspace
                tags:
                    type: array
                    items:
                        allOf:
                            -
                                $ref: '#/components/schemas/Tag'
                            -
                                x-secondary: workspace_tag
        WorkspaceEntity:
            description: Workspace model
            allOf:
                -
                    $ref: '#/components/schemas/WorkspaceBase'
                -
                    properties:
                        resources:
                            description: Resources of the workspace
                            type: array
                            items:
                                $ref: '#/components/schemas/WorkspaceResourceEntity'
                    x-tablename: workspace
        Workspace:
            description: Workspace extended
            allOf:
                -
                    $ref: '#/components/schemas/WorkspaceBase'
                -
                    description: extra attributes
                    type: object
                    properties:
                        resources:
                            description: Resources of the workspace
                            type: array
                            items:
                                $ref: '#/components/schemas/WorkspaceResource'
                        user:
                            $ref: '#/components/schemas/User'
        WorkspaceCollaborator:
            description: Workspace Collaborator of a workspace
            required:
                - user_id
            type: object
            properties:
                id:
                    $ref: '#/components/schemas/PrimaryKey'
                    description: Unique identifier of the WorkspaceCollaborator
                user_id:
                    description: Workspace Collaborator keycloak user id
                    type: string
            x-tablename: workspacecollaborator
        WorkspaceImage:
            description: Workspace images of a workspace
            required:
                - image
            type: object
            properties:
                id:
                    $ref: '#/components/schemas/PrimaryKey'
                    description: Unique identifier of the WorkspaceImage
                image:
                    $ref: '#/components/schemas/ImageType'
                    description: Workspace Image
            x-tablename: workspaceimage
        VolumeStorage:
            description: Volume which can be connected to a workspace
            required:
                - name
            type: object
            properties:
                id:
                    $ref: '#/components/schemas/PrimaryKey'
                    description: Unique identifier of the StorageVolume
                name:
                    description: StorageVolume name
                    type: string
                    example: Storage Volume One
            x-tablename: volumestorage
        OSBRepositoryEntity:
            description: OSB Repository model
            allOf:
                -
                    $ref: '#/components/schemas/OSBRepositoryBase'
                -
                    x-tablename: osbrepository
        OSBRepository:
            description: OSBRepository extended model
            allOf:
                -
                    $ref: '#/components/schemas/OSBRepositoryBase'
                -
                    description: extra attributes
                    type: object
                    properties:
                        context_resources:
                            $ref: '#/components/schemas/RepositoryResourceNode'
                        contexts:
                            type: array
                            items:
                                type: string
                        user:
                            $ref: '#/components/schemas/User'
                        content_types_list:
                            type: array
                            items:
                                $ref: '#/components/schemas/RepositoryContentType'
                        description:
                            description: Repository description
                            type: string
                        timestamp_modified:
                            format: date-time
                            description: Date/time the OSBReposity is last modified
                            type: string
