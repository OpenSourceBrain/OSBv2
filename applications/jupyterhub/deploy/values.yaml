harness:
  subdomain: hub
  secured: false
  service:
    auto: false
    port: 80
    name: proxy-public
  deployment:
    auto: false
  dependencies:
    build:
      - cloudharness-base
    hard:
      - accounts
  quotas:
    # default for User Quotas
    # user quotas can be set as Keycloak attributes on Groups and Users
    # quotas set on User level will always overrule Group quotas
    # the following keys are valid for Jupyterhub pods (workspaces)

    # sets the maximum number of (included named) servers open concurrently (int)
    quota-ws-open: 3
    # sets the cpu guaranteed on a single workspace in CPU units (float)
    quota-ws-guaranteecpu: 0.2
    # sets the cpu limit on a single workspace in CPU units (float)
    quota-ws-maxcpu: 1
    # sets the memory guaranteed on a single workspace in Gb units (float)
    quota-ws-guaranteemem: 0.5
    # sets the memory limit on a single workspace in Gb units (float)
    quota-ws-maxmem: 1
    # sets the storage dedicated to the user data in Gb units (float)
    quota-storage-max : 1.25
nfs_volumes: false
custom:
  # Anonymous sessions are throwaway JupyterHub users, handed out to visitors
  # without a Keycloak token, and deleted again once idle. See
  # applications/jupyterhub/src/osb_jupyter/osb_jupyter/anon_cull.py
  anonymousCull:
    enabled: true
    # delete anonymous sessions idle for longer than this (seconds)
    timeout: 3600
    # seconds between passes
    every: 600
    # most sessions deleted in a single pass, 0 for no limit
    maxPerPass: 200
hub:
  # Control-plane sizing to sustain ~20 concurrent users. The hub coordinates
  # auth/spawn and talks to the sqlite DB; without explicit resources it was
  # CPU-throttled/OOM-killed under load, which surfaced downstream as 503s.
  resources:
    requests:
      cpu: 0.01
      memory: 256Mi
    limits:
      cpu: 4
      memory: 256Mi
  config:
    Authenticator:
      # Users granted JupyterHub admin rights.
      admin_users:
        - a
        - filippo@metacell.us
    JupyterHub:
      admin_access: true
      authenticator_class: ch
      # Cap simultaneous spawns so a burst of logins doesn't stampede the
      # hub/proxy; extra spawns queue instead of overwhelming the control plane.
      concurrent_spawn_limit: 10
      # Headroom above the 20-user target (named servers count individually).
      active_server_limit: 40
  extraConfig:
    timing: |
      c.Spawner.port = 8000
      c.Spawner.http_timeout = 300
      c.Spawner.start_timeout = 300
      c.JupyterHub.tornado_settings = { "headers": { "Content-Security-Policy": "frame-ancestors 'self' localhost localhost:3000 *.osb.local *.metacell.us *.opensourcebrain.org *.v2.opensourcebrain.org"}}
    spawner: >-
      c.Spawner.args = []
    osb_anonymous: |
      # Anonymous sessions are disposable users, so two things keep them from
      # piling up in the hub database and on the NFS server.
      #
      # They never get a home volume. The hook has to be a pre_spawn_hook
      # because KubeSpawner creates the claim at the top of start(), before
      # get_pod_manifest() - and therefore before change_pod_manifest - runs.
      from osb_jupyter import pre_spawn_hook
      c.Spawner.pre_spawn_hook = pre_spawn_hook

      # And they are deleted once idle. jupyterhub-idle-culler's --cull-users
      # cannot do this: it deletes every inactive user, and a real user's home
      # volume is named after their database row id (see pvcNameTemplate below),
      # so they would come back with a new id and an empty home directory.
      anonymous_cull = get_config("custom.anonymousCull", {})
      if anonymous_cull.get("enabled", True):
          c.JupyterHub.services.append({
              "name": "osb-anonymous-cull",
              "command": [
                  "python3", "-m", "osb_jupyter.anon_cull",
                  "--timeout=%d" % anonymous_cull.get("timeout", 3600),
                  "--every=%d" % anonymous_cull.get("every", 600),
                  "--max-per-pass=%d" % anonymous_cull.get("maxPerPass", 200),
              ],
          })
          c.JupyterHub.load_roles.append({
              "name": "osb-anonymous-cull",
              "scopes": ["list:users", "read:users:activity", "admin:users"],
              "services": ["osb-anonymous-cull"],
          })
proxy:
  # configurable-http-proxy (CHP) fronts every request and returns 503 when it
  # is starved or the hub behind it is unreachable. Give it guaranteed capacity
  # so it stays responsive while routing ~20 concurrent users.
  chp:
    resources:
      requests:
        cpu: 0.2
        memory: 256Mi
      limits:
        cpu: 1
        memory: 512Mi
singleuser:
  storage:
    type: dynamic
    capacity: 2Mi
    startTimeout: 3000
    dynamic:
      pvcNameTemplate: osb-user-{userid}
      volumeNameTemplate: osb-user-{userid}
      storageClass: "{{namespace}}-nfs-client"
      storageAccessModes:
      - "ReadWriteMany"
    homeMountPath: /opt/user
    extraLabels: {}
  cpu:
    limit: 1
    guarantee: 0.02
  memory:
    limit: 1G
    guarantee: 0.4G
prePuller:

  # hook relates to the hook-image-awaiter Job and hook-image-puller DaemonSet
  hook:
    enabled: false
  continuous:
    enabled: false
  pullProfileListImages: false
scheduling:
  userPods:
    nodeAffinity:
      matchNodePurpose: require
  