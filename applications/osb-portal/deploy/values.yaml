harness:
  subdomain: www
  secured: true
  deployment:
    auto: true
    port: 80
  service:
    auto: true
    port: 80
  resources:
    - name: "keycloak"
      src: "keycloak.json"
      dst: "/usr/share/nginx/html/keycloak.json"
  sentry: false
  use_services:
    - name: workspaces
    - name: accounts-api
  dependencies:
    build:
      - cloudharness-base
      - cloudharness-frontend-build
    soft:
      - accounts
      - accounts-api
      - workspaces
      - workflows
      - netpyne
      - nwb-explorer
      - jupyterhub
      - jupyterlab
      - notifications
      - backoffice
  test:
    e2e:
      enabled: true
      smoketest: true
      ignoreRequestErrors: false
      ignoreConsoleErrors: false
  uri_role_mapping:
    - roles: []
      uri: /*
      white-listed: true
    - uri: /login
      roles: []
    - uri: /workspaces/open/*
      roles: []